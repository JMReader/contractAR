[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
broadcast = "contracts/broadcast"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[fmt]
line_length = 110
tab_width = 4

[rpc_endpoints]
avalanche_fuji = "https://api.avax-test.network/ext/bc/C/rpc"
