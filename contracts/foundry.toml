[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../shared" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 16
fail_on_revert = true
